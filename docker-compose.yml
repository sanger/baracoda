version: "3.3"
services:
  # MySQL 8.0 service for local development
  # To run it as a standalone container:
  #   docker run --name mysql-8.0 -e MYSQL_ROOT_PASSWORD=postgres -e MYSQL_DATABASE=baracoda_dev -e MYSQL_USER=postgres -e MYSQL_PASSWORD=postgres -d -p 3306:3306 mysql:8.0
  mysql-8.0:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: postgres
      MYSQL_DATABASE: baracoda_dev
      MYSQL_USER: postgres
      MYSQL_PASSWORD: postgres
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
